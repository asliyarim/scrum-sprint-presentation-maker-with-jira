services:
  postgres:
    image: postgres:16-alpine
    container_name: capacity-planner-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-capacity_planner}
      POSTGRES_USER: ${DB_USERNAME:-capacity_planner}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-capacity_planner}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - capacity-planner-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-capacity_planner} -d ${DB_NAME:-capacity_planner}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MSSQL'den Postgres'e gecis oncesi kullanilan eski servis - artik backend
  # buna bagli degil (asagida "postgres" kullaniliyor). SADECE bir kerelik
  # yerel veri tasima scripti icin (bkz. scripts/migrate-local-mssql-to-postgres.ps1)
  # gecici olarak "docker-compose up mssql" ile ayaga kaldirilir. Tasima
  # tamamlandiktan sonra bu servis + capacity-planner-mssql-data volume'u
  # (docker volume rm) guvenle silinebilir.
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: capacity-planner-mssql
    restart: unless-stopped
    profiles: ["migration"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-CapacityPlanner!2024}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - capacity-planner-mssql-data:/var/opt/mssql
    healthcheck:
      # SQL Server 2022 imaji mssql-tools18 kullanir (eskisi mssql-tools); -C
      # sunucu sertifikasini dogrulamadan guvenir (yerel/dev icin yeterli).
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: capacity-planner-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-capacity_planner}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-capacity_planner}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - capacity-planner-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: capacity-planner-backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-capacity_planner}
      DB_USERNAME: ${DB_USERNAME:-capacity_planner}
      DB_PASSWORD: ${DB_PASSWORD:-capacity_planner}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-capacity_planner}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-capacity_planner}
      MINIO_BUCKET: ${MINIO_BUCKET:-capacity-planner-assets}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET .env icinde tanimlanmali}
      JIRA_ENABLED: ${JIRA_ENABLED:-false}
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_ACCOUNT_EMAIL: ${JIRA_ACCOUNT_EMAIL:-}
      JIRA_API_KEY: ${JIRA_API_KEY:-}
      # Dis projelerin /api/integration/** ucunu cagirirken kullandigi servis
      # anahtari. Bos ise entegrasyon uclari kapalidir (bkz. ApiKeyAuthFilter).
      INTEGRATION_API_KEY: ${INTEGRATION_API_KEY:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: capacity-planner-frontend
    restart: unless-stopped
    environment:
      # nginx.conf'taki ${BACKEND_INTERNAL_URL} template degiskeni - Railway'de
      # private network hostname'i, yerelde docker-compose servis adi+portu.
      BACKEND_INTERNAL_URL: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend

volumes:
  capacity-planner-postgres-data:
  capacity-planner-mssql-data:
  capacity-planner-minio-data:
