spring:
  application:
    name: capacity-planner

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:capacity_planner}
    username: ${DB_USERNAME:capacity_planner}
    password: ${DB_PASSWORD:capacity_planner}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  cors:
    # Not: Yayinda bu liste APP_CORS_ALLOWED_ORIGINS ile eziliyor (Railway).
    # Odyssey kabugu API cagrilarini kendi nginx'i uzerinden proxy'ledigi
    # icin tarayici acisindan istek same-origin; ama backend, proxy'nin
    # ilettigi Origin basligini (Odyssey alan adi) gordugunden bu alan adi
    # listede OLMAK ZORUNDA - yoksa POST /api/auth/login 403 doner.
    allowed-origins:
      - http://localhost:4173
      - http://localhost:5173
      - http://localhost:5174
      - http://localhost:5175
      - http://localhost:3000
  cache:
    ttl-seconds: 300
  storage:
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ROOT_USER:capacity_planner}
      secret-key: ${MINIO_ROOT_PASSWORD:capacity_planner}
      bucket: ${MINIO_BUCKET:capacity-planner-assets}

# Dis projelerin kapasite verisini cektigi servis anahtari (bkz.
# integration/security/ApiKeyAuthFilter). Bos birakilirsa entegrasyon uclari
# tamamen kapalidir - anahtar SADECE ortam degiskeninden verilir.
integration:
  api-key: ${INTEGRATION_API_KEY:}

jira:
  enabled: ${JIRA_ENABLED:false}
  base-url: ${JIRA_BASE_URL:}
  account-email: ${JIRA_ACCOUNT_EMAIL:}
  api-key: ${JIRA_API_KEY:}

server:
  port: 8080

logging:
  level:
    com.aksa.capacityplanner: DEBUG
