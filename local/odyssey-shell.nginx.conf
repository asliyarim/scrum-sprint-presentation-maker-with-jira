# Odyssey dis kabugunun YEREL nginx yapilandirmasi.
#
# Depodaki "Landing Page/nginx.conf" Railway icin yazilmis: upstream'lere
# https ile ve public alan adlariyla gidiyor. Yerelde hepsi ayni Docker
# agindaki servisler oldugu icin http + servis adi kullaniyoruz. Bu dosya
# imajdaki sablonun UZERINE baglanir (bkz. docker-compose.odyssey.yml).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 64m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Docker'in yerlesik DNS'i: servis yeniden basladiginda IP degisirse
    # proxy sessizce bozulmasin diye adresler calisma aninda cozulur.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Kimlik dogrulama -> odyssey-auth (kendi Postgres semasiyla)
    location /api/auth/ {
        set $auth_ust "odyssey-auth:8081";
        proxy_pass http://$auth_ust$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
        # Aksa Mailer backend'i. nginx EN UZUN öneki seçer, bu blok aşağıdaki
    # /api/ bloğunu sırası ne olursa olsun yener - Capacity Planner bozulmaz.
    location /api/mailer/ {
        set $mailer_api_ust "mailer-backend:8082";
        proxy_pass http://$mailer_api_ust$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # Aksa Mailer arayüzü -> /mailer/ altından
    location = /mailer {
        return 301 /mailer/;
    }
    location /mailer/ {
        set $mailer_ust "mailer-frontend:80";
        rewrite ^/mailer/(.*)$ /$1 break;
        proxy_pass http://$mailer_ust;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect ~^https?://[^/]+/(.*)$ /mailer/$1;
    }

    # Geri kalan API -> Capacity Planner backend'i
    location /api/ {
        set $api_ust "backend:8080";
        proxy_pass http://$api_ust$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # PO Sprint Sunumu Hazirlayici arayuzu -> /kapasite/ altindan
    location = /kapasite {
        return 301 /kapasite/;
    }
    location /kapasite/ {
        set $kapasite_ust "frontend:80";
        rewrite ^/kapasite/(.*)$ /$1 break;
        proxy_pass http://$kapasite_ust;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect ~^https?://[^/]+/(.*)$ /kapasite/$1;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
